  - id: fin_profit_loss_year_vs_income_cost_assess_fty
    display_name: 损益年累计表 vs 工厂考核收入明细表
    aliases:
      - ads_fin_profit_loss_year
      - ads_fin_income_cost_detail_assess_fty
      - profit loss year
      - factory assessment income detail
      - supply chain profit loss main business income
    perspective: 损益表层级口径与工厂考核收入明细表对账
    primary_tables:
      - yh_doc_ads.ads_fin_profit_loss_year
      - yh_doc_ads.ads_fin_income_cost_detail_assess_fty
    core_lineage:
      - yh_doc_ads.ads_fin_profit_loss_year
      - yh_doc_cdm.dws_fin_profit_loss_year

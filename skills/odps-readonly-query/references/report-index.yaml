        date: '2026-07-03'
        note: 已验证 ads_fin_profit_loss_year 在 org_cd=50018478 下每期有两行：一行是 comp_cd=50018478 的公司行，另一行是 comp_cd 为空的上卷行；只按 org_cd 汇总会导致金额翻倍。
      - type: case
        target: comp_cd 50018478, pt=20260702, acctnt_year=2026
        date: '2026-07-03'
        note: 当“行政组织”指 comp_cd 时，两张表都应按 comp_cd 比较。已验证 FTY 7期累计为 393,170,837.87，损益表公司层级 7期累计为 407,079,797.57，真实差异为 13,908,959.70，原因是来源模型和指标口径不同。
      - type: case
        target: align fty income to profit-loss, pt=20260702, acctnt_year=2026, periods 1-7
        date: '2026-07-03'
        note: 已修正并验证的方法：使用 dws_fin_income_cost_detail_assess_base_tmp 作为共同凭证明细层，关联 dim_fin_profit_loss_report_item_rela 取得供应链主营业务收入规则，套用损益表考核过滤，并使用 -assess_vouch_amt * calc_sign 作为 FTY 考核收入。已验证 comp_cd=50018478 及制造集团全公司与损益表月发生额 max_abs_diff=0。
      - type: trace-table
        target: yh_doc_ads.ads_fin_income_cost_detail_assess_fty
        date: '2026-07-03'
        note: ADS FTY 读取 dws_fin_income_cost_detail_assess，并过滤 manage_fty='F'、grp_cd='20000007'，同时剔除指定科目。
      - type: trace-table
        target: yh_doc_ads.ads_fin_profit_loss_year
        date: '2026-07-03'
        note: ADS 损益年累计表读取 dws_fin_profit_loss_year；该表基于 dws_fin_profit_loss_month 做窗口累计，月度数据来自损益月中间表和会计余额来源，不是来自 FTY ADS 明细表。
